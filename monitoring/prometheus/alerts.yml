groups:

  - name: express-app-alerts

    rules:

      - alert: AppDown
        expr: up{job="express-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Express app is down"
          description: "The Express app is not responding to requests."



      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{job="express-app", status=~"5.."}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on Express app"
          description: "App is experiencing a high error rate"


      - alert: HighRequestRate
        expr: |
          rate(http_requests_total{job="express-app"}[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request rate"
          description: "App is experiencing a high request rate (more than 100 requests per second)"


      - alert: HighCPUUsage
        expr:  100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "The system is experiencing high CPU usage"
          

      - alert: LowAvailableMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low available memory"
          description: "The system is experiencing low available memory"


      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "The system is experiencing low disk space on one or more filesystems"

          